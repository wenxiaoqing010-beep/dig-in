<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070706"><title>DIG IN 藏酌｜开业邀请</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070706}#stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:#070706}.gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:#070706;color:#e5c17b;font-family:"Songti SC","STSong",serif;transition:opacity 1.2s,visibility 1.2s}.gate.off{opacity:0;visibility:hidden}.box{text-align:center;padding:28px}.logo{font-family:Impact,"Arial Narrow",sans-serif;font-size:54px;letter-spacing:.09em}.cn{font-size:17px;letter-spacing:.55em;margin:8px 0 30px}.enter{display:inline-block;border:1px solid #b9945577;padding:13px 28px;font-size:13px;letter-spacing:.28em;color:#e5c17b;background:transparent}.hint{font:10px Georgia,serif;letter-spacing:.18em;opacity:.55;margin-top:16px}.music{position:fixed;z-index:98;right:15px;top:max(14px,env(safe-area-inset-top));width:38px;height:38px;border:1px solid #d6b16d66;border-radius:50%;background:#080806aa;color:#e1bd78;font-size:16px;display:none}.music.show{display:block}.music.on{animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<iframe id="stage" src="original.html" title="DIG IN 藏酌开业邀请"></iframe>
<div class="gate" id="gate"><div class="box"><div class="logo">DIG IN</div><div class="cn">藏酌</div><button class="enter" id="enter">轻触开启 · 今夜入席</button><div class="hint">GRAND OPENING · 10.06 · 19:00</div></div></div>
<button class="music" id="music" aria-label="音乐">♪</button>
<script>
const f=document.getElementById('stage'),gate=document.getElementById('gate'),enter=document.getElementById('enter'),music=document.getElementById('music');
function restyle(){
 try{const d=f.contentDocument;if(!d)return;d.getElementById('intro')?.remove();d.getElementById('sound')?.remove();d.getElementById('counter')?.remove();
 const s=d.createElement('style');s.textContent=`
 body{background:#080806!important}
 .page{background:#080806!important}
 .page:before{content:"";position:absolute;inset:-8%;background-image:var(--poster);background-size:cover;background-position:center;filter:blur(24px) brightness(.38) saturate(.9);transform:scale(1.12);z-index:0}
 .bg{inset:0!important;width:100%!important;height:100%!important;object-fit:contain!important;transform:none!important;z-index:1!important;animation:none!important}
 .page.active .bg{animation:none!important}
 .page:after{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 90px 18px rgba(0,0,0,.58);pointer-events:none}
 .mask{z-index:2!important;background:linear-gradient(180deg,rgba(0,0,0,.08) 15%,rgba(0,0,0,.03) 48%,rgba(0,0,0,.68) 100%)!important}
 .copy{z-index:3!important}
 .eyebrow,.title,.sub,.eng,.line,.details{opacity:1!important;animation:none!important;filter:none!important;transform:none!important}
 .page:not(.active) .copy{opacity:.15;transition:opacity .55s ease}
 .page.active .copy{opacity:1;transition:opacity .8s ease .12s}
 .arrow{animation:none!important;opacity:.55!important}
 `;d.head.appendChild(s);
 [...d.querySelectorAll('.page')].forEach(p=>{const im=p.querySelector('.bg');if(im)p.style.setProperty('--poster','url("'+im.src+'")')});
 }catch(e){}
}
f.addEventListener('load',restyle);

let ac=null, master=null, timer=null, started=false, step=0;
const prog=[[48,52,55,59],[45,48,52,55],[50,53,57,60],[43,47,50,53]]; // Cmaj7 Am7 Dm7 G7-ish voicings
function hz(n){return 440*Math.pow(2,(n-69)/12)}
function tone(freq,t,dur,type='sine',vol=.018){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function brush(t){const b=ac.createBuffer(1,ac.sampleRate*.13,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),g=ac.createGain(),flt=ac.createBiquadFilter();s.buffer=b;flt.type='highpass';flt.frequency.value=3500;g.gain.value=.018;s.connect(flt);flt.connect(g);g.connect(master);s.start(t)}
function bar(){if(!ac)return;const now=ac.currentTime+.05,ch=prog[step%4];ch.forEach((n,i)=>tone(hz(n+12),now,1.65,i%2?'triangle':'sine',.009));const roots=[36,33,38,31],r=roots[step%4];[0,7,9,7].forEach((x,i)=>tone(hz(r+x),now+i*.48,.38,'triangle',.025));for(let i=0;i<4;i++)brush(now+i*.48);if(step%2===1){[64,67,69,67,64].forEach((n,i)=>tone(hz(n),now+.12+i*.28,.24,'sine',.007))}step++}
function startJazz(){if(started)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.72;master.connect(ac.destination);bar();timer=setInterval(bar,1900);started=true;music.classList.add('show','on')}
function toggle(){if(!ac)return;if(ac.state==='running'){ac.suspend();music.classList.remove('on')}else{ac.resume();music.classList.add('on')}}
enter.onclick=()=>{startJazz();restyle();gate.classList.add('off');setTimeout(()=>gate.remove(),1300)};music.onclick=toggle;
</script></body></html>
